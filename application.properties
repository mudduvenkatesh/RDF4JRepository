# ─── Ontotext GraphDB ─────────────────────────────────────────────────────────
graphdb.server-url=http://localhost:7200
graphdb.repository-id=my-repo

# Optional: leave blank if GraphDB security is disabled
graphdb.username=
graphdb.password=

# Base URI used when minting new resource IRIs
graphdb.base-uri=http://example.com/

# Connection pool
graphdb.connection-timeout-ms=5000
graphdb.read-timeout-ms=30000

# ─── Spring Boot 4.0.6 / Framework 7 ─────────────────────────────────────────
# Virtual threads (Java 21+, first-class in Boot 4 on Java 25)
spring.threads.virtual.enabled=true

# API versioning (new in Spring Boot 4 / Framework 7)
# spring.mvc.apiversion.enabled=true
# spring.mvc.apiversion.header-name=X-API-Version

# OpenTelemetry (new spring-boot-starter-opentelemetry in Boot 4)
# management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# Jakarta EE 11 baseline — no javax.* properties needed

# ─── Logging ──────────────────────────────────────────────────────────────────
# Default charset is now UTF-8 (harmonised in Boot 4 for Logback + Log4j2)
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.com.example.graphdb=DEBUG
logging.level.org.eclipse.rdf4j=WARN
